<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can Bartrina - Compte enrere</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #000000; /* Fondo negro */
      overflow: hidden;
    }
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #timer {
      font-size: 25vw; /* Tamaño dinámico basado en el ancho de la pantalla */
      font-weight: bold;
      color: #ff0000; /* Dígitos rojos */
      text-align: center;
      line-height: 1;
      user-select: none;
    }
    .buttons {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      opacity: 0.3; /* Los botones se ven tenues para no distraer */
      transition: opacity 0.3s;
    }
    .buttons:hover {
      opacity: 1; /* Se iluminan por completo al pasar el ratón por encima */
    }
    .buttons button {
      padding: 0.8rem 1.8rem;
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid #ff0000;
      border-radius: 5px;
      background-color: transparent;
      color: #ff0000;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
    }
    .buttons button:hover {
      background-color: #ff0000;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="timer">05:00</div>
    <div class="buttons">
      <button id="start">Inici</button>
      <button id="reset">Torna a començar</button>
    </div>
  </div>

  <!-- Elementos de audio ocultos -->
  <audio id="bg-sound" src="fondo.mp3" preload="auto" loop></audio>
  <audio id="alarm-sound" src="alarma.mp3" preload="auto"></audio>

  <script>
    const timerDisplay = document.getElementById("timer");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    
    const bgSound = document.getElementById("bg-sound");
    const alarmSound = document.getElementById("alarm-sound");

    let countdown;
    let timeLeft = 3; // 5 minutos en segundos
    let isRunning = false;

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;

      bgSound.play().catch(error => {
        console.log("Error al reproduir el so de fons: ", error);
      });

      countdown = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerDisplay.textContent = formatTime(timeLeft);
        } else {
          clearInterval(countdown);
          isRunning = false;
          
          bgSound.pause();
          bgSound.currentTime = 0;
          
          alarmSound.play().catch(error => {
            console.log("Error al reproduir l'alarma: ", error);
          });
          
          alert("¡S'ha acabat el temps!");
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      isRunning = false;
      timeLeft = 3;
      timerDisplay.textContent = formatTime(timeLeft);
      
      bgSound.pause();
      bgSound.currentTime = 0;
      
      alarmSound.pause();
      alarmSound.currentTime = 0;
    }

    startButton.addEventListener("click", startTimer);
    resetButton.addEventListener("click", resetTimer);
  </script>

</body>
</html>
