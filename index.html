<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can Bartrina - Compte enrere</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Creepster', cursive, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #000000;
      overflow: hidden;
    }
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #timer {
      font-size: 28vw;
      font-weight: normal;
      color: #ff0000;
      text-align: center;
      line-height: 1;
      user-select: none;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .buttons {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    .buttons:hover {
      opacity: 1;
    }
    .buttons button {
      padding: 0.8rem 1.8rem;
      font-size: 1.5rem;
      cursor: pointer;
      border: 2px solid #ff0000;
      border-radius: 5px;
      background-color: transparent;
      color: #ff0000;
      font-family: inherit;
      transition: all 0.2s;
    }
    .buttons button:hover {
      background-color: #ff0000;
      color: #000000;
      box-shadow: 0 0 15px #ff0000;
    }

    /* ======================================================= */
    /* NUEVO: ESTILOS PARA LA VENTANA EMERGENTE (JUMPSCARE)    */
    /* ======================================================= */
    .jumpscare-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      background-image: url('https://c.tenor.com/OWqCMKoDF0MAAAAC/tenor.gif');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain; /* O 'cover' si quieres que recorte y llene toda la pantalla */
      z-index: 9999;
      display: none; /* Oculto por defecto */
      cursor: pointer; /* Indica que se puede hacer clic */
      animation: shake 0.2s infinite; /* Efecto de vibración terrorífica */
    }
    
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(0px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(2px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="timer">10:00</div>
    <div class="buttons">
      <button id="start">Iniciar</button>
      <button id="reset">Torna a començar</button>
    </div>
  </div>

  <!-- NUEVO: Elemento div para la ventana emergente -->
  <div id="jumpscare" class="jumpscare-overlay"></div>

  <audio id="bg-sound" src="fondo.mp3" preload="auto" loop></audio>
  <audio id="bg-sound2" src="music-box.mp3" preload="auto" loop></audio>
  <audio id="alarm-sound" src="alarma.mp3" preload="auto"></audio>
  <audio id="alarm-sound2" src="scream.mp3" preload="auto"></audio>

  <script>
    const timerDisplay = document.getElementById("timer");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    
    const bgSound = document.getElementById("bg-sound");
    const bgSound2 = document.getElementById("bg-sound2");
    const alarmSound = document.getElementById("alarm-sound");
    const alarmSound2 = document.getElementById("alarm-sound2");
    
    // NUEVO: Referencia al elemento del susto
    const jumpscareOverlay = document.getElementById("jumpscare");

    let countdown;
    let timeLeft = 300; 
    let isRunning = false;

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;

      bgSound.play().catch(error => {
        console.log("Error al reproducir sonido de fondo: ", error);
      });
      bgSound2.play().catch(error => {
        console.log("Error al reproducir sonido 2 de fondo: ", error);
      });

      countdown = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerDisplay.textContent = formatTime(timeLeft);
        } else {
          clearInterval(countdown);
          isRunning = false;
          
          bgSound.pause();
          bgSound.currentTime = 0;
          bgSound2.pause();
          bgSound2.currentTime = 0;
          
          alarmSound.play().catch(error => {
            console.log("Error al reproducir la alarma: ", error);
          });

          alarmSound2.play().catch(error => {
            console.log("Error al reproducir la alarma 2: ", error);
          });
          
          // =======================================================
          // MODIFICADO: Muestra la ventana emergente en vez de alert
          // =======================================================
          jumpscareOverlay.style.display = "block";
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      isRunning = false;
      timeLeft = 3;
      timerDisplay.textContent = formatTime(timeLeft);
      
      bgSound.pause();
      bgSound.currentTime = 0;
      bgSound2.pause();
      bgSound2.currentTime = 0;
      
      alarmSound.pause();
      alarmSound.currentTime = 0;
      alarmSound2.pause();
      alarmSound2.currentTime = 0;
      
      // NUEVO: Oculta el susto si se le da a reiniciar manualmente
      jumpscareOverlay.style.display = "none";
    }

    // =======================================================
    // NUEVO: Evento para cerrar el susto haciendo clic en él
    // =======================================================
    jumpscareOverlay.addEventListener("click", () => {
      jumpscareOverlay.style.display = "none";
      alarmSound.pause();
      alarmSound.currentTime = 0;
      alarmSound2.pause();
      alarmSound2.currentTime = 0;
    });

    startButton.addEventListener("click", startTimer);
    resetButton.addEventListener("click", resetTimer);
  </script>

</body>
</html>
