<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador de 5 Minutos con Sonidos</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    #timer {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .buttons button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0 0.3rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      transition: background-color 0.2s;
    }
    .buttons button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="timer">05:00</div>
    <div class="buttons">
      <button id="start">Iniciar</button>
      <button id="reset">Reiniciar</button>
    </div>
  </div>

  <!-- Elementos de audio ocultos -->
  <audio id="bg-sound" src="fondo.mp3" preload="auto" loop></audio>
  <audio id="alarm-sound" src="alarma.mp3" preload="auto"></audio>

  <script>
    const timerDisplay = document.getElementById("timer");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    
    const bgSound = document.getElementById("bg-sound");
    const alarmSound = document.getElementById("alarm-sound");

    let countdown;
    let timeLeft = 300; // 5 minutos en segundos
    let isRunning = false;

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;

      // Inicia el sonido de fondo (gracias al clic en "Iniciar" el navegador lo permite)
      bgSound.play().catch(error => {
        console.log("Error al reproducir sonido de fondo: ", error);
      });

      countdown = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerDisplay.textContent = formatTime(timeLeft);
        } else {
          clearInterval(countdown);
          isRunning = false;
          
          // Detiene el sonido de fondo al terminar
          bgSound.pause();
          bgSound.currentTime = 0;
          
          // Reproduce la alarma final
          alarmSound.play().catch(error => {
            console.log("Error al reproducir la alarma: ", error);
          });
          
          alert("¡Tiempo cumplido!");
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      isRunning = false;
      timeLeft = 300;
      timerDisplay.textContent = formatTime(timeLeft);
      
      // Detiene y resetea ambos sonidos
      bgSound.pause();
      bgSound.currentTime = 0;
      
      alarmSound.pause();
      alarmSound.currentTime = 0;
    }

    startButton.addEventListener("click", startTimer);
    resetButton.addEventListener("click", resetTimer);
  </script>

</body>
</html>
